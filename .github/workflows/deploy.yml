name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Ensure the full repository is checked out

      # Clean up at the very start to ensure no stale worktrees
      # - name: Clean up existing worktree
      #   run: |
      #     git worktree prune
      #     git worktree remove --force github-pages-deploy-action-temp-deployment-folder || true
      #     rm -rf github-pages-deploy-action-temp-deployment-folder
      #   if: always()

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.3.0"
          # node-version: 'lts/*'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # branch: main
          branch: gh-pages
          folder: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
